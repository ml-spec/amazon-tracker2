<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Poker League — 2026</title>
<style>
:root{
  --bg:#0b2a24; --panel:#10342d; --ink:#f4f1e7; --muted:#a9bbb4; --line:#24473f;
  --gold:#efc66a; --mint:#7dd6b1; --blue:#8fa4e5; --pink:#dfa1b5;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:auto;padding:34px 46px 28px}.topline{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.kicker,.year,.label,.section-no,.night-date,.award-kicker{font-size:13px;text-transform:uppercase;letter-spacing:.18em;font-weight:800}
.kicker,.label,.section-no,.night-date,.award-kicker{color:var(--gold)} .year{color:var(--muted);font-weight:600}
h1{font-size:54px;line-height:1;margin:14px 0 8px;font-weight:800}.sub{font-size:17px;color:var(--muted)}
.rule{border-top:1px solid var(--line);margin:22px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:36px;padding:1px 0}
.kpi strong{display:block;font-size:29px;line-height:1.15;margin:9px 0 6px}.kpi small{font-size:14px;color:var(--muted)}
.main{display:grid;grid-template-columns:1fr 1.1fr;gap:58px}.section-title{display:flex;align-items:baseline;gap:18px;margin-bottom:12px}.section-title h2{font-size:21px;margin:0}.section-no{font-size:12px}
.table-head,.stand-row{display:grid;grid-template-columns:42px 1fr 45px 70px;align-items:center;column-gap:10px}.table-head{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;padding:0 0 8px}.stand-row{min-height:29px;font-size:16px}.stand-row.leader{background:rgba(125,214,177,.08)}
.rank{color:var(--muted);text-align:center}.name{display:flex;align-items:center;gap:12px}.name-text{min-width:116px}.leader .name-text{color:var(--gold);font-weight:800}.bar{height:5px;flex:1;background:transparent;position:relative}.bar>i{display:block;height:5px;border-radius:8px;background:var(--mint)}.leader .bar>i{background:var(--gold)}
.pts{font-weight:800;text-align:right}.played{color:var(--muted);text-align:right}.zero-group{margin-top:22px;color:var(--muted);font-size:15px;line-height:1.55}.zero-group b{display:block;color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.footnote{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
.chart-sub{font-size:14px;color:var(--muted);margin:-4px 0 15px}.chart-wrap{height:280px;position:relative}.chart-wrap svg{width:100%;height:100%;overflow:visible}.legend{display:flex;gap:26px;flex-wrap:wrap;margin:7px 0 12px;color:var(--ink);font-size:14px}.legend span{display:flex;align-items:center;gap:8px}.legend i{width:20px;border-top:3px solid currentColor;display:block}.chart-note{font-size:14px;color:var(--muted);line-height:1.55;margin:8px 0 20px}
.latest{margin-top:14px}.result-row{display:grid;grid-template-columns:110px 1fr 34px;gap:12px;align-items:center;height:25px;font-size:14px}.result-bar{height:6px}.result-bar i{display:block;height:6px;border-radius:8px;background:var(--mint)}.result-row:first-of-type .result-bar i{background:var(--gold)}.result-row b{text-align:right}
.nights{display:grid;grid-template-columns:repeat(6,1fr);gap:28px}.night-date{font-size:12px;margin-bottom:6px}.night-row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;line-height:1.55}.night-row:first-of-type{color:var(--ink);font-weight:800;font-size:15px}.night-row:first-of-type b{color:var(--gold)}
.awards-title{color:var(--gold);font-size:13px;letter-spacing:.17em;text-transform:uppercase;font-weight:800;margin-bottom:20px}.awards{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}.award-kicker{color:var(--muted);font-size:10px;letter-spacing:.03em}.award strong{display:block;font-size:20px;margin:7px 0 5px}.award small{color:var(--muted);font-size:12px}.source{font-size:11px;color:var(--muted);line-height:1.55;margin-top:28px}
@media(max-width:900px){.wrap{padding:28px 20px}.kpis{grid-template-columns:1fr 1fr}.main{grid-template-columns:1fr}.nights{grid-template-columns:repeat(2,1fr)}.awards{grid-template-columns:1fr 1fr}h1{font-size:42px}}
@media(max-width:560px){.topline{display:block}.year{margin-top:8px}.kpis{grid-template-columns:1fr}.nights,.awards{grid-template-columns:1fr}.table-head,.stand-row{grid-template-columns:34px 1fr 38px 48px}.name-text{min-width:88px}.main{gap:34px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topline"><div><div class="kicker">The Poker League</div><h1>The chase is on.</h1><div class="sub" id="dateRange"></div></div><div class="year" id="yearNights"></div></div>
  <div class="rule"></div><section class="kpis" id="kpis"></section><div class="rule"></div>
  <section class="main">
    <div><div class="section-title"><span class="section-no">01</span><h2>Championship standings</h2></div><div id="standings"></div></div>
    <div>
      <div class="section-title"><span class="section-no">02</span><h2>The championship race</h2></div><div class="chart-sub">Cumulative points across all recorded nights</div><div class="chart-wrap" id="chart"></div><div class="legend" id="legend"></div><div class="chart-note" id="chartNote"></div>
      <div class="latest"><div class="section-title"><span class="section-no">03</span><h2 id="latestTitle"></h2></div><div id="latest"></div></div>
    </div>
  </section>
  <div class="rule"></div><div class="section-title"><span class="section-no">04</span><h2 id="nightsTitle"></h2></div><section class="nights" id="nights"></section>
  <div class="rule"></div><div class="awards-title">The unofficial awards</div><section class="awards" id="awards"></section>
  <div class="source" id="source"></div>
</div>
<script>
const league = {
  season: 2026,
  players:["Marwan","Omran","Talal","Youssef","Fadi Chams","Tarek","Hedi","Fadi N","Hoss","Aboudi","Samy","Karim F","Riaz","Moustafa","Abdo","Wadih","Cem","Imran","Dipu","Wassef","Samer"],
  nights:[
    {date:"2026-09-01", scores:{Omran:4,Talal:6,Hedi:3,Samy:1,Moustafa:2}},
    {date:"2026-09-08", scores:{Marwan:2,Omran:6,Aboudi:4,"Karim F":3,Abdo:1}},
    {date:"2026-09-29", scores:{Marwan:6,Omran:3,Youssef:4,Tarek:2,Hedi:1}},
    {date:"2026-10-14", scores:{Marwan:4,Omran:2,Talal:6,Youssef:1,Samy:3}},
    {date:"2026-10-20", scores:{Marwan:3,Youssef:6,Tarek:4,Hedi:2,Hoss:1}},
    {date:"2026-11-03", scores:{Marwan:2,Youssef:1,"Fadi N":6,Hoss:4,Riaz:3}}
  ]
};
const COLORS=["var(--mint)","var(--gold)","var(--blue)","var(--pink)"];
const fmtDate=(s,short=false)=>{const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-GB",short?{day:"numeric",month:"short"}:{day:"numeric",month:"long",year:"numeric"})};
const totals=Object.fromEntries(league.players.map(p=>[p,0])), played=Object.fromEntries(league.players.map(p=>[p,0]));
league.nights.forEach(n=>Object.entries(n.scores).forEach(([p,v])=>{totals[p]+=v;played[p]++}));
const standings=[...league.players].sort((a,b)=>totals[b]-totals[a]||league.players.indexOf(a)-league.players.indexOf(b));
let denseRank=0,lastScore=null; const ranks={}; standings.forEach(p=>{if(totals[p]!==lastScore){denseRank++;lastScore=totals[p]}ranks[p]=denseRank});
const scoredPlayers=league.players.filter(p=>totals[p]>0); const leader=standings[0], second=standings[1], thirdPts=totals[standings[2]];
const totalLeaguePoints=Object.values(totals).reduce((a,b)=>a+b,0); const perNight=league.nights.map(n=>Object.values(n.scores).reduce((a,b)=>a+b,0));
const firstDate=league.nights[0].date,lastDate=league.nights.at(-1).date;
document.getElementById('dateRange').textContent=`${fmtDate(firstDate)}–${fmtDate(lastDate)}`;
document.getElementById('yearNights').textContent=`${league.season} / ${league.nights.length} NIGHTS`;
document.getElementById('kpis').innerHTML=`
<div class="kpi"><div class="label">Championship leader</div><strong>${leader}</strong><small>${totals[leader]} points</small></div>
<div class="kpi"><div class="label">Lead over ${second}</div><strong>${totals[leader]-totals[second]} points</strong><small>${totals[leader]-thirdPts} points ahead of joint third</small></div>
<div class="kpi"><div class="label">League points</div><strong>${totalLeaguePoints}</strong><small>${perNight.every(v=>v===perNight[0])?perNight[0]+' awarded each night':'Across '+league.nights.length+' nights'}</small></div>
<div class="kpi"><div class="label">The field</div><strong>${league.players.length} players</strong><small>${scoredPlayers.length} with recorded points</small></div>`;
const maxPts=totals[leader];
let st=`<div class="table-head"><span>Rank</span><span>Player</span><span>Pts</span><span>Scored*</span></div>`;
standings.filter(p=>totals[p]>0).forEach(p=>{st+=`<div class="stand-row ${p===leader?'leader':''}"><span class="rank">${ranks[p]}</span><span class="name"><span class="name-text">${p}</span><span class="bar"><i style="width:${Math.max(4,totals[p]/maxPts*100)}%"></i></span></span><span class="pts">${totals[p]}</span><span class="played">${played[p]}/${league.nights.length}</span></div>`});
const zero=standings.filter(p=>totals[p]===0); st+=`<div class="zero-group"><b>Tied rank ${ranks[zero[0]]} · 0 points</b>${zero.join(' · ')}</div><div class="footnote">Dense ranks follow the original scorecard.<br>*Dates with points; attendance is not recorded.</div>`;
document.getElementById('standings').innerHTML=st;
const top4=standings.slice(0,4); const W=520,H=250, pad={l:34,r:50,t:14,b:38}; const maxY=Math.ceil(maxPts/5)*5;
let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative championship points">`;
for(let y=0;y<=maxY;y+=5){const yy=pad.t+(maxY-y)/(maxY)*(H-pad.t-pad.b);svg+=`<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="7" y="${yy+4}" fill="var(--muted)" font-size="12">${y}</text>`}
const xs=league.nights.map((_,i)=>pad.l+i*(W-pad.l-pad.r)/(league.nights.length-1)); league.nights.forEach((n,i)=>{svg+=`<text x="${xs[i]}" y="${H-10}" text-anchor="middle" fill="var(--muted)" font-size="12">${fmtDate(n.date,true)}</text>`});
const legend=document.getElementById('legend'); let legendHtml='';
top4.forEach((p,pi)=>{let cum=0,pts=[];league.nights.forEach((n,i)=>{cum+=n.scores[p]||0;const yy=pad.t+(maxY-cum)/maxY*(H-pad.t-pad.b);pts.push([xs[i],yy,cum])});const dash=p===top4[3]?' stroke-dasharray="4 4"':'';svg+=`<polyline points="${pts.map(q=>q[0]+','+q[1]).join(' ')}" fill="none" stroke="${COLORS[pi]}" stroke-width="3"${dash}/>`;pts.forEach((q,i)=>svg+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="${COLORS[pi]}" stroke="var(--bg)" stroke-width="1.5"/>`);const q=pts.at(-1);svg+=`<text x="${q[0]+15}" y="${q[1]+4}" fill="${COLORS[pi]}" font-size="14" font-weight="800">${q[2]}</text>`;legendHtml+=`<span style="color:${COLORS[pi]}"><i></i><em style="font-style:normal;color:var(--ink)">${p}</em></span>`}); svg+='</svg>';document.getElementById('chart').innerHTML=svg;legend.innerHTML=legendHtml;
document.getElementById('chartNote').textContent=`${second} led early; ${leader} drew level on ${fmtDate(league.nights.at(-2).date,true)}, then moved ahead.`;
const latest=league.nights.at(-1), latestResults=Object.entries(latest.scores).sort((a,b)=>b[1]-a[1]); document.getElementById('latestTitle').textContent=`Latest night: ${fmtDate(latest.date,true)}`;document.getElementById('latest').innerHTML=latestResults.map(([p,v])=>`<div class="result-row"><span>${p}</span><span class="result-bar"><i style="width:${v/6*100}%"></i></span><b>${v}</b></div>`).join('');
document.getElementById('nightsTitle').textContent=`${league.nights.length} nights. ${league.nights.length} top scores.`;document.getElementById('nights').innerHTML=league.nights.map(n=>`<div><div class="night-date">${fmtDate(n.date,true)}</div>${Object.entries(n.scores).sort((a,b)=>b[1]-a[1]).map(([p,v])=>`<div class="night-row"><span>${p}</span><b>${v}</b></div>`).join('')}</div>`).join('');
const sixCounts=Object.fromEntries(league.players.map(p=>[p,league.nights.filter(n=>n.scores[p]===6).length])); const sixMax=Math.max(...Object.values(sixCounts)); const sixSpecial=league.players.filter(p=>sixCounts[p]===sixMax).join(' + '); const tieGroups={}; scoredPlayers.forEach(p=>(tieGroups[totals[p]]??=[]).push(p)); const dead=Object.entries(tieGroups).filter(([v,a])=>a.length>1&&+v>0).sort((a,b)=>+b[0]-+a[0])[0]; const late=Object.fromEntries(league.players.map(p=>[p,league.nights.slice(-3).reduce((s,n)=>s+(n.scores[p]||0),0)])); const lateLeader=[...league.players].sort((a,b)=>late[b]-late[a])[0];
document.getElementById('awards').innerHTML=`<div class="award"><div class="award-kicker">King of the table</div><strong>${leader}</strong><small>${totals[leader]} points; scored on ${played[leader]} of ${league.nights.length} dates.</small></div><div class="award"><div class="award-kicker">Six-point specialist</div><strong>${sixSpecial}</strong><small>${sixMax} six-point nights; most in the league.</small></div><div class="award"><div class="award-kicker">The dead heat</div><strong>${dead[1].join(' + ')}</strong><small>Joint ${ranks[dead[1][0]]===1?'first':ranks[dead[1][0]]===2?'second':ranks[dead[1][0]]===3?'third':ranks[dead[1][0]]+'th'} with ${dead[0]} points each.</small></div><div class="award"><div class="award-kicker">Late surge</div><strong>${lateLeader}</strong><small>${late[lateLeader]} points over the final three dates.</small></div>`;
document.getElementById('source').innerHTML=`Source: user-supplied poker scorecard. All ${totalLeaguePoints} totals reconcile to the ${league.nights.length} dated columns.<br>Blank cells mean no points recorded. Points are league scores; cash winnings and attendance are unavailable.`;
</script>
</body></html>
